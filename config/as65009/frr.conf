frr version 10.2.1
frr defaults traditional
hostname as65009
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 203.0.113.1/24
exit
!
router bgp 65009
 bgp router-id 10.0.49.3
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 timers bgp 3 9
 !
 neighbor 10.0.49.2 remote-as 65004
 neighbor 10.0.49.2 description Peering-to-AS65004
 !
 address-family ipv4 unicast
  network 203.0.113.0/24
  neighbor 10.0.49.2 activate
  neighbor 10.0.49.2 send-community both
  neighbor 10.0.49.2 route-map RM_IN_AS65004 in
 exit-address-family
exit
!
route-map RM_IN_AS65004 permit 10
 set local-preference 100
exit
!
line vty
exit
