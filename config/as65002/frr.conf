frr version 10.2.1
frr defaults traditional
hostname as65002
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
router bgp 65002
 bgp router-id 10.0.12.3
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 timers bgp 3 9
 !
 neighbor 10.0.12.2 remote-as 65001
 neighbor 10.0.12.2 description Peering-to-AS65001
 neighbor 10.0.25.3 remote-as 65005
 neighbor 10.0.25.3 description Peering-to-AS65005
 neighbor 10.0.26.3 remote-as 65006
 neighbor 10.0.26.3 description Peering-to-AS65006
 !
 address-family ipv4 unicast
  neighbor 10.0.12.2 activate
  neighbor 10.0.12.2 send-community both
  neighbor 10.0.12.2 route-map RM_IN_AS65001 in
  neighbor 10.0.25.3 activate
  neighbor 10.0.25.3 send-community both
  neighbor 10.0.25.3 route-map RM_IN_AS65005 in
  neighbor 10.0.26.3 activate
  neighbor 10.0.26.3 send-community both
  neighbor 10.0.26.3 route-map RM_IN_AS65006 in
 exit-address-family
exit
!
route-map RM_IN_AS65001 permit 10
 set local-preference 100
exit
!
route-map RM_IN_AS65005 permit 10
 set local-preference 100
exit
!
route-map RM_IN_AS65006 permit 10
 set local-preference 100
exit
!
line vty
exit
