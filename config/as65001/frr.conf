frr version 10.2.1
frr defaults traditional
hostname as65001
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 192.0.2.1/24
 ip address 198.51.100.1/24
exit
!
ip route 0.0.0.0/0 10.0.12.3
!
router bgp 65001
 bgp router-id 10.0.12.2
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 timers bgp 3 9
 !
 neighbor 10.0.12.3 remote-as 65002
 neighbor 10.0.12.3 description Peering-to-AS65002-Transit
 !
 address-family ipv4 unicast
  network 192.0.2.0/24
  network 198.51.100.0/24
  neighbor 10.0.12.3 activate
  neighbor 10.0.12.3 route-map RM_OUT out
 exit-address-family
exit
!
route-map RM_OUT permit 10
exit
!
line vty
exit
