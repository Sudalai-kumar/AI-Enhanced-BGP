frr version 10.2.1
frr defaults traditional
hostname as65001
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
router bgp 65001
 bgp router-id 10.0.12.2
 no bgp ebgp-requires-policy
 bgp log-neighbor-changes
 timers bgp 3 9
 !
 neighbor 10.0.12.3 remote-as 65002
 neighbor 10.0.12.3 description Peering-to-AS65002
 neighbor 10.0.13.3 remote-as 65003
 neighbor 10.0.13.3 description Peering-to-AS65003
 neighbor 10.0.14.3 remote-as 65004
 neighbor 10.0.14.3 description Peering-to-AS65004
 !
 address-family ipv4 unicast
  neighbor 10.0.12.3 activate
  neighbor 10.0.12.3 send-community both
  neighbor 10.0.12.3 route-map RM_IN_AS65002 in
  neighbor 10.0.13.3 activate
  neighbor 10.0.13.3 send-community both
  neighbor 10.0.13.3 route-map RM_IN_AS65003 in
  neighbor 10.0.14.3 activate
  neighbor 10.0.14.3 send-community both
  neighbor 10.0.14.3 route-map RM_IN_AS65004 in
 exit-address-family
exit
!
route-map RM_IN_AS65002 permit 10
 set local-preference 100
exit
!
route-map RM_IN_AS65003 permit 10
 set local-preference 100
exit
!
route-map RM_IN_AS65004 permit 10
 set local-preference 100
exit
!
line vty
exit
